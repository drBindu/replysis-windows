name: Verify Windows App

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.4.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.6.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: dotnet restore InterviewCopilot.csproj
      - run: dotnet build InterviewCopilot.csproj --configuration Release --no-restore
      - run: dotnet list InterviewCopilot.csproj package --vulnerable --include-transitive
      - run: python -m py_compile speechmatics_engine.py
      # The suites existed but CI only compiled. A rule that answers a real
      # interview question with a fixed reply passes a build and fails these.
      - name: App behaviour tests
        run: dotnet run --project tests/CleanerTests --configuration Release
      - name: Engine contract tests
        run: python tests/test_engine_contract.py
      - name: Output pipeline tests
        run: python tests/verify_output_pipeline.py
      - name: Recording failure and duration tests
        run: python tests/test_recording.py
      - name: Store version stamping tests
        run: python tests/test_store_packaging.py
