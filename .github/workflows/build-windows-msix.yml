# Builds the MSIX for the Microsoft Store listing (Varoxel.Replysis, app id
# 9N13GQC3MKK9). The other Windows channel, the .exe customers download from the
# website, is built by release-windows.yml.
#
# This deliberately does NOT publish a GitHub release. It used to, and that is a
# trap: copies installed from the .exe look at the newest release in this repo to
# find their update, so a Store build landing on top would contain no update
# package and would quietly stall every one of those users until the next .exe
# release. The MSIX is left as a build artifact for you to upload to Partner
# Center by hand, which is a step Microsoft requires a human for anyway.
name: Build Windows MSIX

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Store version, higher than the last submitted one (e.g. 1.0.14)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.4.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.6.0
        with:
          dotnet-version: '8.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      # The speech engine, built exactly as the direct download builds it.
      #
      # This step did not exist, and its absence was silent: the app project
      # pulls the engine in with a wildcard, and a wildcard matching nothing is
      # not an error. The Store package therefore built cleanly and shipped
      # without the engine - an app that launches, looks correct, and cannot
      # transcribe a word, which is the entire product.
      - name: Build the speech engine
        shell: powershell
        run: |
          python -m venv build\engine-venv
          powershell -ExecutionPolicy Bypass -File tools\build-engine.ps1
          if (-not (Test-Path "engine-dist\speechmatics_engine\speechmatics_engine.exe")) {
            throw "The speech engine was not produced. Refusing to package an app that cannot transcribe."
          }

      # Two restores, because they do different things.
      #
      # nuget restore alone left the app project without obj/project.assets.json
      # and msbuild stopped with NETSDK1004. That file is written by an SDK-style
      # restore, which nuget restore on the packaging project does not perform
      # for the project it references.
      - name: Restore packages
        shell: powershell
        run: |
          dotnet restore InterviewCopilot.csproj
          nuget restore InterviewCopilotPackager\InterviewCopilotPackager.wapproj

      # ── Certificate ────────────────────────────────────────────────────────
      # A certificate is not needed to submit to the Store, and this step used to
      # require one.
      #
      # Microsoft re-signs Store packages with its own certificate once the app
      # passes certification, which is why this app was published to the Store
      # in the first place without anyone owning a certificate. Signing it here
      # is not merely unnecessary: a signature whose publisher does not match
      # the Partner Center identity is a documented cause of submission being
      # rejected.
      #
      # So the certificate is optional and only used for the sideload path - the
      # .appinstaller feed below, which is installed directly rather than through
      # the Store and does need a trusted signature. Without one, the build still
      # produces the bundle to upload to Partner Center, which is the thing this
      # workflow exists for.
      - name: Import certificate for the sideload feed (optional)
        id: cert
        shell: powershell
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX)) {
            Write-Host "No certificate configured. Building an unsigned bundle,"
            Write-Host "which is exactly what Partner Center wants - Microsoft signs it"
            Write-Host "after certification."
            echo "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX)
          $pfxPath  = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          $securePass = ConvertTo-SecureString -String $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePass

          echo "signed=true"                         >> $env:GITHUB_OUTPUT
          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          echo "PFX_PATH=$pfxPath"                   >> $env:GITHUB_ENV
          echo "Imported cert: $($cert.Subject)"

      # ── Version ────────────────────────────────────────────────────────────
      - name: Set version
        shell: powershell
        run: |
          # The version is given, not counted.
          #
          # This used to be "1.0.<run_number>.0", and the run counter belongs to
          # this workflow alone - it had never run, so the first build would have
          # produced 1.0.1.0 and the Store refuses anything not higher than what
          # is already listed. The number also drifts away from the direct
          # download's version, so the two channels would report different
          # versions of the same build.
          #
          # Rejected at the door rather than at submission, which is the slow
          # place to find out.
          $v = "${{ inputs.version }}"
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must look like 1.0.14, got '$v'"
          }
          $version = "$v.0"
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV
          echo "Version: $version"

      - name: Update version in Package.appxmanifest
        shell: powershell
        run: |
          $path     = "InterviewCopilotPackager\Package.appxmanifest"
          $content  = Get-Content $path -Raw
          $content  = $content -replace 'Version="\d+\.\d+\.\d+\.\d+"', "Version=`"${{ env.APP_VERSION }}`""
          Set-Content $path $content -Encoding UTF8

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build the MSIX bundle
        shell: powershell
        run: |
          $args = @(
            "InterviewCopilotPackager\InterviewCopilotPackager.wapproj",
            "/p:Configuration=Release",
            "/p:Platform=x64",
            "/p:AppxBundle=Always",
            "/p:AppxBundlePlatforms=x64",
            "/p:GenerateTestArtifacts=false",
            "/p:AppxPackageDir=.\AppxPackages\"
          )
          if ("${{ steps.cert.outputs.signed }}" -eq "true") {
            $args += @(
              "/p:AppxPackageSigningEnabled=true",
              "/p:PackageCertificateThumbprint=${{ env.CERT_THUMBPRINT }}",
              "/p:PackageCertificateKeyFile=${{ env.PFX_PATH }}",
              "/p:PackageCertificatePassword=${{ secrets.WINDOWS_CERT_PASSWORD }}"
            )
          } else {
            $args += "/p:AppxPackageSigningEnabled=false"
          }
          msbuild @args

      # ── Package ────────────────────────────────────────────────────────────
      - name: Rename bundle to clean name
        shell: powershell
        run: |
          $bundle = Get-ChildItem -Path "AppxPackages" -Filter "*.msixbundle" -Recurse | Select-Object -First 1
          if (-not $bundle) { throw "No .msixbundle found in AppxPackages" }

          # Built beside the app is not the same as inside the package. Checked
          # here because the failure is invisible: a package missing the engine
          # installs and launches normally and simply never transcribes.
          $staged = Get-ChildItem -Path "InterviewCopilotPackager\bin" -Recurse `
                      -Filter "speechmatics_engine.exe" -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          if (-not $staged) {
            throw "The bundle does not contain the speech engine. Not shipping an app that cannot transcribe."
          }
          Write-Host "Speech engine present: $($staged.FullName)"
          Copy-Item $bundle.FullName "InterviewCopilot.msixbundle"
          echo "Bundle: $($bundle.Name) ($([math]::Round($bundle.Length / 1MB, 1)) MB)"

      - name: Generate .appinstaller
        shell: powershell
        run: |
          $version   = "${{ env.APP_VERSION }}"
          $publisher = "${{ secrets.WINDOWS_CERT_PUBLISHER }}"
          $repo      = "${{ github.repository }}"
          $runNum    = "${{ github.run_number }}"
          $bundleUrl = "https://github.com/$repo/releases/download/windows-v$version/InterviewCopilot.msixbundle"

          $xml = @"
          <?xml version="1.0" encoding="utf-8"?>
          <AppInstaller
              Uri="https://github.com/$repo/releases/latest/download/InterviewCopilot.appinstaller"
              Version="$version"
              xmlns="http://schemas.microsoft.com/appx/appinstaller/2017/2">
            <MainBundle
                Name="2fc37bc6-4936-47c4-982b-3f02ee0cab60"
                Version="$version"
                Publisher="$publisher"
                Uri="$bundleUrl" />
            <UpdateSettings>
              <OnLaunch HoursBetweenUpdateChecks="0" />
            </UpdateSettings>
          </AppInstaller>
          "@
          Set-Content "InterviewCopilot.appinstaller" $xml -Encoding UTF8
          echo "Bundle URL: $bundleUrl"

      # ── Artifact for Partner Center ────────────────────────────────────────
      # Downloaded from the run summary and uploaded to Partner Center by hand.
      # Deliberately not a GitHub release: see the note at the top of this file.
      - name: Publish the bundle as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: replysis-msix-${{ env.APP_VERSION }}
          path: InterviewCopilot.msixbundle
          retention-days: 30
          if-no-files-found: error

      # ── Deploy to Oracle Cloud ─────────────────────────────────────────────
      - name: Setup SSH key
        shell: powershell
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          $keyPath = "$env:RUNNER_TEMP\oracle_key.pem"
          Set-Content -Path $keyPath -Value $env:ORACLE_SSH_KEY -Encoding ASCII
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(R)" | Out-Null
          echo "SSH_KEY_PATH=$keyPath" >> $env:GITHUB_ENV

      - name: Configure trusted Oracle host key
        shell: powershell
        env:
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ORACLE_KNOWN_HOSTS)) {
            throw "ORACLE_KNOWN_HOSTS is required. Add the server's verified ssh-keyscan output as a GitHub secret."
          }
          $knownHostsPath = "$env:RUNNER_TEMP\known_hosts"
          Set-Content -Path $knownHostsPath -Value $env:ORACLE_KNOWN_HOSTS -Encoding ASCII
          echo "KNOWN_HOSTS_PATH=$knownHostsPath" >> $env:GITHUB_ENV

      - name: Deploy .appinstaller to website
        shell: powershell
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          $key  = "${{ env.SSH_KEY_PATH }}"
          $knownHosts = "${{ env.KNOWN_HOSTS_PATH }}"
          $host = $env:ORACLE_HOST
          $dest = "ubuntu@${host}"

          # Upload .appinstaller to server /tmp/
          scp -i $key -o UserKnownHostsFile=$knownHosts -o StrictHostKeyChecking=yes `
            "InterviewCopilot.appinstaller" `
            "${dest}:/tmp/InterviewCopilot.appinstaller"

          # Atomically replace the host-mounted installer without making the container writable.
          $remoteCmd = "install -d -m 0755 ~/coopilotx/assets && install -m 0644 /tmp/InterviewCopilot.appinstaller ~/coopilotx/assets/InterviewCopilot.appinstaller.next && mv ~/coopilotx/assets/InterviewCopilot.appinstaller.next ~/coopilotx/assets/InterviewCopilot.appinstaller && rm /tmp/InterviewCopilot.appinstaller && echo 'Deployed OK'"
          ssh -i $key -o UserKnownHostsFile=$knownHosts -o StrictHostKeyChecking=yes $dest $remoteCmd
